.tease { position: relative; z-index: 2; margin: 12px 16px 0; padding: 12px; border-radius: 16px; background: var(--ch2); display: flex; gap: 12px; align-items: center; box-shadow: 0 4px 0 var(--ch2-deep); }
.tease .lock { width: 40px; height: 40px; border-radius: 8px; background: var(--ch2-soft); color: var(--ch2-deep); display: grid; place-items: center; font-size: 20px; }
.tease .caption-4 { color: var(--ch2-soft); }
.cta { position: relative; margin: 16px 16px 0; z-index: 2; }
.cta a { display: flex; justify-content: center; gap: 4px; align-items: center; margin-top: 8px; color: #fff; text-decoration: none; }
