<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="mockup-height" content="1180">
<title>Cast sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Geist:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF6EE;font-family:Geist,sans-serif;color:#24201C;padding:32px 48px}
h1{font:600 36px/40px 'Bricolage Grotesque';margin:0 0 4px}
p{margin:0 0 24px;font-size:16px;line-height:24px;color:#5E554B}
.row{display:grid;grid-template-columns:120px repeat(7,1fr);gap:12px;align-items:end;margin-bottom:16px}
.name{font:600 20px/28px 'Bricolage Grotesque'}
.name small{display:block;font:500 12px/16px Geist;color:#5E554B}
.cell{background:#F1E9DC;border-radius:16px;overflow:hidden;aspect-ratio:1}
.cell div{width:100%;height:100%}
.hdr{font:600 12px/16px Geist;color:#5E554B;text-align:center}
</style></head><body>
<h1>The cast, seven states</h1>
<p>Neutral, listening, thinking, nod, smile, hmm, talking. Plain shapes on one 200 grid, ready for a Flutter CustomPainter.</p>
<div class="row"><div></div><div class="hdr">Neutral</div><div class="hdr">Listening</div><div class="hdr">Thinking</div><div class="hdr">Nod</div><div class="hdr">Smile</div><div class="hdr">Hmm</div><div class="hdr">Talking</div></div>
<div id="rows"></div>
<script src="../shared/cast.js"></script>
<script>
const roles={priya:'Recruiter',marcus:'Hiring manager',lena:'Senior engineer',sam:'Head of product'}
const ex=['neutral','listening','thinking','nod','smile','hmm','talk']
document.getElementById('rows').innerHTML=Object.keys(roles).map(n=>`<div class="row"><div class="name">${n[0].toUpperCase()+n.slice(1)}<small>${roles[n]}</small></div>${ex.map(e=>`<div class="cell"><div data-cast="${n}" data-expr="${e}"></div></div>`).join('')}</div>`).join('')
Cast.mount()
</script></body></html>
