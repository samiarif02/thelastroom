<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the value of `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Last Room: an interview-practice game that looks like a film. One room left between you and the offer.">
  <meta name="theme-color" content="#0B1E33">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="The Last Room">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>The Last Room</title>

  <!-- Branded loading screen (brief §9: first frame < 3 s, no flash; brief 20: the vivid sky).
       Colours mirror packages/brand BrandVivid (sky, horizon, accent); this file can't import
       Dart tokens. The type is the app's own bundled Manrope ExtraBold, same origin. -->
  <style>
    @font-face {
      font-family: 'Manrope';
      font-weight: 800;
      src: url('assets/packages/brand/fonts/manrope/Manrope-ExtraBold.ttf');
    }
    html, body { margin: 0; height: 100%; background: #0B1E33; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(ellipse at 60% 115%, rgba(242, 153, 74, 0.45), transparent 55%),
        linear-gradient(#0B1E33, #15405A 50%, #1A5258);
      color: #FFC23D; font: 800 15px/1.3 Manrope, system-ui, sans-serif; letter-spacing: 0.35em;
      transition: opacity 400ms ease;
    }
    @media (prefers-reduced-motion: no-preference) {
      #loading span { animation: breathe 2.4s ease-in-out infinite; }
      @keyframes breathe { 50% { opacity: 0.45; } }
    }
  </style>
</head>
<body>
  <div id="loading" aria-label="Loading The Last Room"><span>THE LAST ROOM</span></div>
  <!-- flutter_soloud's audio engine (WASM), bundled with the app: no network request. -->
  <script src="assets/packages/flutter_soloud/web/init_soloud.js" defer></script>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    // Zero setup, no network (AGENTS.md 6), in `flutter run -d chrome` as in the release build:
    // CanvasKit comes from this server, not www.gstatic.com, and the engine's Roboto fallback
    // from web/fonts/, not fonts.gstatic.com (the app's own text is all in the bundled brand
    // fonts; a glyph none of them has shows as a box rather than fetching a Noto font).
    // The loader reads the config for CanvasKit; the engine reads it at initializeEngine.
    const config = { canvasKitBaseUrl: 'canvaskit/', fontFallbackBaseUrl: 'fonts/' };
    _flutter.loader.load({
      config: config,
      onEntrypointLoaded: async function (engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine(config);
        await appRunner.runApp();
        const loading = document.getElementById('loading');
        loading.style.opacity = '0';
        setTimeout(function () { loading.remove(); }, 400);
      },
    });
  </script>
</body>
</html>
