name: brand
description: "The Last Room's design tokens (colour, chapter grades, type, spacing, radii, motion) and ThemeData. The only place a raw colour value may be written."
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

# Prototype fonts for the three cinematic directions (brief 03). Bundled, never fetched at
# runtime (zero setup, ADR 0005). Static, Latin-subset instances of the OFL originals, one
# OFL.txt per family. Brief 06 deletes the two directions that lose.
flutter:
  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: fonts/instrument_serif/InstrumentSerif-Regular.ttf
        - asset: fonts/instrument_serif/InstrumentSerif-Italic.ttf
          style: italic
    - family: Geist
      fonts:
        - asset: fonts/geist/Geist-Regular.ttf
        - asset: fonts/geist/Geist-Medium.ttf
          weight: 500
    - family: BigShouldersDisplay
      fonts:
        - asset: fonts/big_shoulders_display/BigShouldersDisplay-SemiBold.ttf
          weight: 600
        - asset: fonts/big_shoulders_display/BigShouldersDisplay-ExtraBold.ttf
          weight: 800
    - family: InterTight
      fonts:
        - asset: fonts/inter_tight/InterTight-Regular.ttf
        - asset: fonts/inter_tight/InterTight-SemiBold.ttf
          weight: 600
    - family: CormorantGaramond
      fonts:
        - asset: fonts/cormorant_garamond/CormorantGaramond-Medium.ttf
          weight: 500
        - asset: fonts/cormorant_garamond/CormorantGaramond-SemiBold.ttf
          weight: 600
        - asset: fonts/cormorant_garamond/CormorantGaramond-MediumItalic.ttf
          weight: 500
          style: italic
    - family: Manrope
      fonts:
        - asset: fonts/manrope/Manrope-Regular.ttf
        - asset: fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
