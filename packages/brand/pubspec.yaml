name: brand
description: "The Last Room's design tokens (colour, chapter grades, type, spacing, radii, motion) and ThemeData. The only place a raw colour value may be written."
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

# Daylight's pair (docs/design/direction.md, "Type"): Bricolage Grotesque (display) + Geist
# (reading), the variable fonts exactly as github.com/google/fonts ships them, each with its
# OFL.txt. Bundled, never fetched at runtime (zero setup, ADR 0005). The axes are set per style
# (`DaylightType`), so one file per family covers every weight and optical size.
#
# The film pair below (Cormorant Garamond + Manrope) stays only until the last screen still on
# the film and vivid tokens is restyled (WS2); then it goes.
#
# Each variable file is listed once per weight the styles use, so the engine finds an exact
# match and never synthesises a fake bold over the `wght` axis.
flutter:
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: fonts/bricolage_grotesque/BricolageGrotesque-Variable.ttf
          weight: 600
    - family: Geist
      fonts:
        - asset: fonts/geist/Geist-Variable.ttf
        - asset: fonts/geist/Geist-Variable.ttf
          weight: 500
        - asset: fonts/geist/Geist-Variable.ttf
          weight: 600
    # Phosphor (MIT, fonts/phosphor/LICENSE): the icon fonts of @phosphor-icons/web 2.1.1, the
    # glyphs named in lib/src/phosphor_icons.dart (tool/phosphor_icons.py). Release builds
    # subset them to the glyphs used.
    - family: PhosphorRegular
      fonts:
        - asset: fonts/phosphor/Phosphor-Regular.ttf
    - family: PhosphorBold
      fonts:
        - asset: fonts/phosphor/Phosphor-Bold.ttf
    - family: PhosphorFill
      fonts:
        - asset: fonts/phosphor/Phosphor-Fill.ttf
    - family: CormorantGaramond
      fonts:
        - asset: fonts/cormorant_garamond/CormorantGaramond-Medium.ttf
          weight: 500
        - asset: fonts/cormorant_garamond/CormorantGaramond-SemiBold.ttf
          weight: 600
        - asset: fonts/cormorant_garamond/CormorantGaramond-MediumItalic.ttf
          weight: 500
          style: italic
    - family: Manrope
      fonts:
        - asset: fonts/manrope/Manrope-Regular.ttf
        - asset: fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: fonts/manrope/Manrope-ExtraBold.ttf
          weight: 800
