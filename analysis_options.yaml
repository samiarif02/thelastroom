# One strict analysis config for the whole workspace (packages have no analysis_options of their
# own, so this file applies everywhere). CI runs `flutter analyze --fatal-infos`, so every lint
# below fails the build: there are no "just warnings". See docs/rules/code-quality.md.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Promote the ones that are bugs, not style, so they read as errors in the IDE too.
    missing_return: error
    unawaited_futures: error
    avoid_dynamic_calls: error
    avoid_print: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/build/**"

linter:
  rules:
    # Types and nullability (the Dart side of "no any")
    - avoid_dynamic_calls
    - always_declare_return_types
    - avoid_annotating_with_dynamic
    - avoid_type_to_string
    - type_annotate_public_apis
    - cast_nullable_to_non_nullable
    # Async correctness
    - unawaited_futures
    - discarded_futures
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    # No stray output: use the log wrapper (docs/rules/logging.md)
    - avoid_print
    # Readability and consistency
    - prefer_single_quotes
    - require_trailing_commas
    - prefer_final_locals
    - prefer_final_in_for_each
    - prefer_const_constructors
    - prefer_const_declarations
    - sort_child_properties_last
    - directives_ordering
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_named_constants
    - avoid_redundant_argument_values
    - only_throw_errors
    - use_super_parameters
