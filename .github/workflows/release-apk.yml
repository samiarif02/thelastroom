name: Release APK

# Builds the Android release APK with the pinned Flutter and attaches it to a DRAFT GitHub
# release. It never publishes: the owner reviews the draft and publishes it by hand
# (docs/rules/deployment.md: the APK goes on a GitHub Release at milestones).
#
# Run it from the Actions tab with a tag (e.g. v0.1.0), or push a tag matching v*.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
  push:
    tags: ['v*']

concurrency:
  group: release-apk-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    name: Build the APK and draft the release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Pinned: the same version README.md and ci.yml use.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      # No --dart-define-from-file: the zero-setup build, offline, no keys (ADR 0005).
      - name: Build the release APK
        working-directory: apps/mobile
        run: flutter build apk --release

      - name: Name the APK and its checksum
        run: |
          mkdir -p dist
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk "dist/the-last-room-$TAG.apk"
          (cd dist && sha256sum "the-last-room-$TAG.apk" > "the-last-room-$TAG.apk.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: the-last-room-${{ env.TAG }}
          path: dist/

      # A draft release for the tag: created the first time, its files replaced after that.
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --target "$GITHUB_SHA" \
              --title "The Last Room $TAG" \
              --notes "Android APK of The Last Room, built by the Release APK workflow from $GITHUB_SHA. Install it directly (debug-signed, not for Google Play). No keys or network needed: the game plays offline. See docs/SUBMISSION.md."
          fi
