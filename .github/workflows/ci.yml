name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The commit-msg hook checks each commit as it's made; this re-checks every commit on the
  # PR, so one made with --no-verify, or before the hook was installed, still fails the
  # branch. The synthetic merge commit a pull_request checkout sits on starts "Merge " and
  # is exempt.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-commit-message.mjs --range origin/${{ github.base_ref }}..HEAD

  # Every gate, in this order. .claude/skills/local-review runs exactly these `npm run`
  # commands in the same order before a push; check:standards (local-review-mirrors-ci)
  # fails if the two lists drift.
  check:
    name: Gates, tests & web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned: the same version README.md states (check:standards flutter-version-pinned).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      # One resolution for the whole Dart pub workspace.
      - name: Install Dart dependencies
        run: flutter pub get

      # Re-scans every tracked file (session logs included); the pre-commit hook only sees
      # staged blobs, and --no-verify skips it.
      - name: Check secrets
        run: npm run check:secrets

      - name: Check standards
        run: npm run check:standards

      - name: Format check
        run: npm run format:check

      # Strict analysis (strict-casts/inference/raw-types); --fatal-infos fails on every lint.
      - name: Analyze
        run: npm run analyze

      - name: Check events
        run: npm run check:events

      - name: Check env
        run: npm run check:env

      # Every create table in supabase/migrations/ enables RLS and has a policy, in that file.
      - name: Check RLS
        run: npm run check:rls

      # Gate-script tests, then every workspace package (flutter test or dart test).
      - name: Tests
        run: npm run test

      # The Edge Functions (Deno): lint, format and unit tests, with the AI API mocked, so no
      # key or network is involved (ADR 0006). Pinned to the version the tests were written on.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: Edge Function tests
        run: npm run test:functions

      # Build check: the web build is the reviewers' demo link, so it must always build.
      - name: Build web
        run: npm run build:web

  # The landing page (web/, a static Next.js export; ADR 0007): lint, strict types and the
  # static build, as 8x's web template runs them. Its own toolchain, so its own job.
  # Vercel deploys it from its Git integration; CI only checks it, so it holds no secret.
  web:
    name: Landing page (web/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # next/font downloads the two fonts here; the export lands in web/out/.
      - name: Build
        run: npm run build

  # The database, for real: replay every migration on a fresh local Postgres (the Supabase
  # image, so auth.users and the API roles exist), then the pgTAP RLS tests in supabase/tests/.
  # Only the database container starts; no hosted project and no secrets are involved.
  db:
    name: Migrations & RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned, so a CLI release can't change the stack under a green branch.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start the local database
        run: supabase db start

      - name: Replay migrations and run the RLS tests
        run: npm run test:db
